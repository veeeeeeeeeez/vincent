"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
run_mode = "concurrent"

[scripts.run.serve]
available_in = [ "local" ]
command = "echo \"Serving at http://localhost:$CONDUCTOR_PORT\" && python3 -m http.server $CONDUCTOR_PORT --bind 127.0.0.1"
default = true
icon = "globe"
